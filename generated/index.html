<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Todo List Manager</title>
    </head>
    <body>
        <h1>My Todo List</h1>
        
        <form action="/add" method="post">
            <input type="text" name="new-todo" placeholder="New task..." required>
            <button type="submit">Add Task</button>
        </form>
        
        <ul>
            {% for todo in todos %}
                <li>{{ todo }}</li>
            {% endfor %}
        </ul>
    </body>
</html>
