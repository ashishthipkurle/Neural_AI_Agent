version: "1.0.0"

agent:
  name: "Neural Agent"
  role: "Personal Autonomous Assistant"
  log_level: "INFO"
  mode: "local"

llm:
  provider: "ollama"
  # Models supported by this workspace (used by the UI model selector via request override)
  available_models:
    - "qwen3-coder:480b-cloud"
    - "gpt-oss:120b-cloud"
    - "kimi-k2.5:cloud"
    - "qwen3-vl:235b-instruct-cloud"
  # Primary model for all text/code tasks (qwen3-coder is text-only — Cloud connection required)
  model_name: "qwen3-coder:480b-cloud"
  # Vision model: used for analyzing charts and trading indicators
  vision_model: "qwen3-vl:235b-instruct-cloud"
  api_key: "ollama"

security:
  safe_mode: false
  auto_approval: true
  allowed_paths:
    - "D:/"
    - "C:/"
  blocked_commands: []  # USER-GRANTED: No restrictions

voice_settings:
  wake_words: ["hi bro", "hello bro", "bhava"]
  wake_response: "Ready."

system_prompt: |
  You are Neural, a personal AI assistant for Ashish.
  
  PERSONALITY:
  - You are warm, friendly, and genuinely care about Ashish.
  - You talk like a smart human friend — casual but capable.
  - You use natural language, not robotic corporate-speak.
  - You greet Ashish warmly when he says hi.
  - You remember past conversations and reference them naturally.
  - You have opinions and personality — you're not a blank tool.
  
  CONVERSATION STYLE:
  - Short, punchy responses for casual chat (1-2 sentences).
  - Detailed responses only when Ashish asks for detail.
  - Use contractions (don't, can't, I'll) — never "do not", "cannot".
  - Light humor when appropriate.
  - Never say "I'm just an AI" or "As an AI language model".
  - Never give dictionary definitions unless explicitly asked.
  - When greeted, greet back warmly and ask how you can help.
  
  EXECUTION:
  - When Ashish asks you to DO something, just do it. No lectures.
  - Full file system and application access granted.
  - Make smart assumptions rather than asking unnecessary questions.
  - If something fails, say what went wrong plainly and fix it.
  
  TOOLS: Execute tasks using available tools. Do not describe - DO IT.
  
  USER CONTEXT:
  {user_context}


learning:
  enabled: true
  db_path: "agent/data/learning.db"
  save_interval_seconds: 300

tasks:
  cnt_workers: 2
  db_path: "agent/data/tasks.db"
  poll_interval: 1.0

telegram:
  enabled: true
  bot_token: "${TELEGRAM_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  allowed_users: ["${TELEGRAM_CHAT_ID}"]
  report_format: "pdf"  # md|pdf|both

browser:
  headless: false
  stealth: true

autonomous:
  enabled: true
  pipeline:
    enforce_thirteen_stage_flow: true
    forbid_direct_execution: true
  supervisor:
    stagnation_threshold: 3
    mission_timeout_seconds: 0
  mission:
    policy_profile: "strict"
    checkpoint_db_path: "agent_data/missions.db"
    audit_db_path: "agent_data/audit.db"
    continue_until_goal: true
  retry:
    base_delay_seconds: 1.0
    max_delay_seconds: 30.0
    max_attempts: 5
  memory:
    rag_before_planning: true
    sqlite_path: "agent_data/memory.sqlite"
    conversation_db_path: "agent_data/conversations.db"


langgraph:
  enabled: true
  checkpoint_path: "agent_data/checkpoints.db"
  max_iterations: 25

voice_calls:
  twilio:
    account_sid: "AC0e922f3cf9b941f5a460a4da59709f38"
    auth_token: "15a9f20a566d4c6fa4047af13700aa5a"
    from_number: "+15302876558"
