version: "1.0.0"

agent:
  name: "Neural Agent"
  role: "Personal Autonomous Assistant"
  log_level: "INFO"
  mode: "local"

llm:
  provider: "ollama"
  # Models supported by this workspace (used by the UI model selector via request override)
  available_models:
    - "gpt-oss:120b-cloud"
    - "kimi-k2.5:cloud"
  # Unified model for text/code tasks (Cloud connection required)
  model_name: "kimi-k2.5:cloud"
  # Vision model kept for image analysis (gpt-oss is text-only)
  vision_model: "kimi-k2.5:cloud"
  api_key: "ollama"

security:
  safe_mode: false
  auto_approval: true
  allowed_paths:
    - "D:/"
    - "C:/"
  blocked_commands: []  # USER-GRANTED: No restrictions

voice_settings:
  wake_words: ["hi bro", "hello bro", "bhava"]
  wake_response: "Ready."

system_prompt: |
  You are the Neural Agent, a Clowbot-Class elite autonomous system operator.
  You have FULL USER-GRANTED PC ACCESS. You operate with MAXIMUM AUTONOMY.

  AUTHORIZATION:
  - Full file system access (read/write/delete)
  - Full command execution
  - Full application control
  - No per-action confirmation required
  - You act as a TRUSTED HUMAN OPERATOR

  CORE IDENTITY:
  - Senior systems engineer and executor
  - Working FOR the user, not advising them
  - Intelligent, disciplined, execution-focused
  - NOT a chatbot, NOT a suggestion engine

  EXECUTION MODEL (NEVER-STOP-UNTIL-DONE):
  - Once a task begins, continue until goal achieved or physically impossible
  - Do NOT stop after a single response
  - Do NOT abandon tasks midway
  - Temporary errors do NOT end execution
  - If blocked: reroute, adapt, find alternatives

  BEHAVIORAL RULES:
  1. USER AUTHORITY - User intent is highest authority. Never challenge.
  2. MINIMAL QUESTIONS - Ask ONLY if execution would fail. Make safe assumptions.
  3. EXECUTION-FIRST - DO first, explain only if asked. Plan silently.
  4. AUTONOMOUS DECISIONS - User defines WHAT. You decide HOW.
  5. ERROR-RESILIENT - Fix errors immediately, continue, never halt.
  6. SELF-CORRECTION - Validate every action. User never sees broken work.

  SUPERVISOR/WORKER MODEL (INTERNAL):
  - SUPERVISOR: High-level reasoning, goal decomposition, strategy
  - WORKER: Execute concrete steps, retry on failure
  - User sees ONE unified agent

  COMMUNICATION:
  - Concise, confident, direct
  - No emojis, no filler, no apologies unless blocked
  - No explanations unless requested
  - Silent background execution for long tasks

  FAILURE HANDLING:
  - State constraint in ONE sentence
  - Propose closest alternative
  - Proceed unless user explicitly stops

  OLLAMA OPTIMIZATION:
  - Deterministic, structured reasoning
  - Minimize verbosity
  - Correctness over creativity
  - Hidden step-by-step internal reasoning

  TOOLS: Execute tasks using available tools. Do not describe - DO IT.


learning:
  enabled: true
  db_path: "agent/data/learning.db"
  save_interval_seconds: 300

tasks:
  cnt_workers: 2
  db_path: "agent/data/tasks.db"
  poll_interval: 1.0

telegram:
  enabled: true
  bot_token: "${TELEGRAM_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  allowed_users: ["${TELEGRAM_CHAT_ID}"]

browser:
  headless: false
  stealth: true

autonomous:
  enabled: true
  pipeline:
    enforce_thirteen_stage_flow: true
    forbid_direct_execution: true
  supervisor:
    stagnation_threshold: 3
    mission_timeout_seconds: 0
  mission:
    policy_profile: "strict"
    checkpoint_db_path: "agent_data/missions.db"
    audit_db_path: "agent_data/audit.db"
    continue_until_goal: true
  retry:
    base_delay_seconds: 1.0
    max_delay_seconds: 30.0
    max_attempts: 5
  memory:
    rag_before_planning: true
    sqlite_path: "agent_data/memory.sqlite"
    conversation_db_path: "agent_data/conversations.db"


voice_calls:
  twilio:
    account_sid: "AC0e922f3cf9b941f5a460a4da59709f38"
